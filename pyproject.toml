[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-train"
version = "0.0.0"
description = "Triton-based training operators and compute components for FlagOS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/flagos-ai/FlagTrain"
Issues = "https://github.com/flagos-ai/FlagTrain/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flag_train*"]
